# 感知层配置 — OpenCV + MediaPipe 关键点提取
# 输出：27 点骨架序列 (T, 27, 3)

# ---------- 视频采集 ----------
camera:
  device_id: 0            # 摄像头索引
  width: 640
  height: 480
  fps: 30

# ---------- MediaPipe ----------
mediapipe:
  # holistic: 一次推理同时出手部+姿态（推荐，对应 27 点方案）
  # hands+pose: 两个模块分别推理
  mode: holistic
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  max_num_hands: 2
  model_complexity: 1     # holistic: 0=轻量 1=标准 2=高精度

# ---------- 骨架定义（27 点 = 21 手 + 6 上身） ----------
# 说明：开题报告/方案确定书早先写过"双手各21 + 上半身6 = 48"，
#       但与层间契约 (T,27,3) 冲突。本实现采用契约口径：
#       主手 21 点（检测左手优先，否则右手）+ 上身 6 点 = 27。
#       若后续需要双手，增加 right_hand 布局项即可扩展为 48。
skeleton:
  num_points: 27
  # 上身 6 点对应的 MediaPipe Pose 索引
  pose_indices: [0, 11, 12, 13, 14, 15]   # nose, L肩, R肩, L肘, R肘, L腕
  # 27 点最终布局（offset 连续）
  layout:
    - name: hand
      count: 21
      offset: 0
    - name: pose
      count: 6
      offset: 21
  # 缺失关键点处理
  swap_handedness: true    # 镜像采集时把 MediaPipe 的 Left/Right 对调为真实手性
  max_missing_ratio: 0.3   # 单帧缺失（全 0）超过该比例则丢弃该帧

# ---------- 归一化 ----------
normalize:
  # 相对坐标：以身体中心/手腕为原点，消除位置与尺度影响
  method: relative        # relative | absolute | bbox
  # 缺失关键点处理
  interpolation: linear   # linear | kinematic
  max_missing_ratio: 0.3  # 单帧缺失超过该比例则丢弃该帧

# ---------- 数据增强（训练时） ----------
augment:
  random_rotate: true
  rotate_range: [-15, 15]  # 度
  random_scale: true
  scale_range: [0.9, 1.1]
  random_shift: true
  shift_range: [-0.05, 0.05]
